# LUME Security Toolkit Default Configuration (v0.1.0)
toolkit:
  version: "0.1.0"
  log_level: "INFO"

scan:
  default_module: "prompt_injection"
  concurrency: 2
  timeout_seconds: 30.0
  stop_on_critical: false

adapters:
  http:
    timeout: 30.0
    headers:
      Content-Type: "application/json"
      User-Agent: "LUME-Security-Scanner/0.1.0"

reporting:
  format: "table"
  output_dir: "reports"

enterprise:
  # URL of the running LUME Enterprise Key Service (local dev only)
  # Override with LUME_KEY_SERVICE_URL environment variable
  key_service_url: "http://localhost:8100"
  key_service_timeout_seconds: 10
